version: '3.8'

services:
  # ============================================
  # LLM Backend - Ollama (Local AI Model Server)
  # ============================================
  ollama:
    image: ollama/ollama:latest
    container_name: mycelium-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./models:/root/.ollama/models
    environment:
      # Uncomment if you have GPU support (NVIDIA)
      # - OLLAMA_NUM_GPU=1
      - OLLAMA_NUM_GPU=0  # CPU only (set to 1 for GPU)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # Mycelium Hub - Intent-Driven Core
  # ============================================
  mycelium-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mycelium-hub-core
    ports:
      - "8000:8000"      # API/Daemon server (dashboard backend)
      - "8082:8082"      # Dashboard UI
      - "7001:7001"      # Speech/Voice service
    environment:
      # LLM Configuration
      - MYCELIUM_OLLAMA_MODEL=qwen2.5-coder:latest
      - OLLAMA_URL=http://ollama:11434
      
      # Service URLs (for integration)
      - JELLYFIN_URL=http://jellyfin:8096
      - RADARR_URL=http://radarr:7878
      - SONARR_URL=http://sonarr:8989
      - JELLYSEERR_URL=http://jellyseerr:5055
      - QBITTORRENT_URL=http://qbittorrent:8080
      
      # Dashboard
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8082
      - DAEMON_HOST=0.0.0.0
      - DAEMON_PORT=8000
    volumes:
      - ./state:/app/state
      - ./mycelium/logs:/app/mycelium/logs
      - ./mycelium/memory:/app/mycelium/memory
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # Media Services Stack
  # ============================================

  # Jellyfin - Media Server
  jellyfin:
    image: nyanmisaka/jellyfin:latest
    container_name: jellyfin
    ports:
      - "8096:8096"
      - "8920:8920"
      - "1900:1900/udp"
      - "7359:7359/udp"
    environment:
      - JELLYFIN_DATA_DIR=/config
      - JELLYFIN_CACHE_DIR=/cache
      - JELLYFIN_LOG_DIR=/config/logs
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - /mnt/media:/media:ro  # Adjust to your media mount point
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Radarr - Movie Management
  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    ports:
      - "7878:7878"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - UMASK=022
    volumes:
      - radarr_config:/config
      - /mnt/media/movies:/movies
      - /mnt/downloads:/downloads
    depends_on:
      - qbittorrent
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Sonarr - TV Show Management
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    ports:
      - "8989:8989"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - UMASK=022
    volumes:
      - sonarr_config:/config
      - /mnt/media/tv:/tv
      - /mnt/downloads:/downloads
    depends_on:
      - qbittorrent
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Jellyseerr - Request Management
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    ports:
      - "5055:5055"
    environment:
      - LOG_LEVEL=debug
      - TZ=UTC
    volumes:
      - jellyseerr_config:/app/config
    depends_on:
      - jellyfin
      - radarr
      - sonarr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5055/api/v1/settings/main"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # qBittorrent - Download Client
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    ports:
      - "8080:8080"      # WebUI
      - "6881:6881"      # Torrent port (TCP)
      - "6881:6881/udp"  # Torrent port (UDP)
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - UMASK=022
      - WEBUI_PORT=8080
    volumes:
      - qbittorrent_config:/config
      - /mnt/downloads:/downloads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # Monitoring & Logging (Optional)
  # ============================================

  # Watchtower - Auto-update containers
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_REMOVE_VOLUMES=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * *  # Run at 4 AM daily
    restart: unless-stopped

# ============================================
# Volumes
# ============================================
volumes:
  ollama_data:
    driver: local
  
  # Mycelium volumes
  mycelium_state:
    driver: local
  mycelium_logs:
    driver: local
  
  # Media services volumes
  jellyfin_config:
    driver: local
  jellyfin_cache:
    driver: local
  radarr_config:
    driver: local
  sonarr_config:
    driver: local
  jellyseerr_config:
    driver: local
  qbittorrent_config:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  default:
    name: mycelium-network
    driver: bridge
