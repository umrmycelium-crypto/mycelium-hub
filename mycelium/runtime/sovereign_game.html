<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sovereign Sync | Mycelium</title>
    <style>
        :root {
            --bg: #050507;
            --accent: #8a2be2;
            --parent-color: #00f2ff;
            --child-color: #ff00ff;
            --text: #e0e0ff;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg); color: var(--text);
            font-family: 'Segoe UI', sans-serif; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #game-canvas {
            position: absolute; top: 0; left: 0; z-index: -1;
        }
        .ui-layer {
            z-index: 1; text-align: center; pointer-events: none;
        }
        .heartbeat {
            width: 100px; height: 100px;
            border: 4px solid var(--accent);
            border-radius: 50%;
            margin: 20px auto;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.2rem;
            animation: pulse 2s infinite ease-in-out;
            box-shadow: 0 0 30px var(--accent);
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 1; }
        }
        .instruction {
            font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase;
            text-shadow: 0 0 10px var(--accent);
        }
        .connection-status {
            position: absolute; bottom: 30px; font-size: 0.8rem; opacity: 0.5;
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <div class="ui-layer">
        <div class="heartbeat" id="heart">SYNCING...</div>
        <div class="instruction" id="msg">Wait for the Architect...</div>
    </div>
    <div class="connection-status">Sovereign Link: Active | Protocol: Mesh-Sync</div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const heart = document.getElementById('heart');
        const msg = document.getElementById('msg');
        
        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.onresize = resize;
        resize();

        class Particle {
            constructor(color) {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.size = Math.random() * 3 + 1;
                this.color = color;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if(this.x < 0 || this.x > width) this.vx *= -1;
                if(this.y < 0 || this.y > height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        // Initialize particles for both players
        for(let i=0; i<50; i++) particles.push(new Particle('#00f2ff')); // Parent
        for(let i=0; i<50; i++) particles.push(new Particle('#ff00ff')); // Child

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 7, 0.2)';
            ctx.fillRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // Simulation of real-time sync via server
        setInterval(async () => {
            try {
                const res = await fetch('/ai/Sync heartbeat check');
                const data = await res.json();
                if(data.result && data.result.includes("SYNCED")) {
                    heart.innerText = "SYNCED";
                    heart.style.borderColor = "#00ff00";
                    heart.style.boxShadow = "0 0 40px #00ff00";
                    msg.innerText = "The Bond is Strong";
                }
            } catch(e) {}
        }, 3000);
    </script>
</body>
</html>
