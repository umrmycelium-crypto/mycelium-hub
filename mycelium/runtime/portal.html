<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galaxy Wolf | Sovereign</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --accent-color: #8a2be2;
            --text-color: #e0e0ff;
            --glow-color: rgba(138, 43, 226, 0.5);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #background-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
            filter: blur(20px);
        }

        .container {
            text-align: center;
            z-index: 1;
            width: 90%;
            max-width: 400px;
        }

        .mushroom-logo {
            width: 120px;
            height: 120px;
            background: var(--accent-color);
            border-radius: 50% 50% 20% 20%;
            margin: 0 auto 20px;
            box-shadow: 0 0 40px var(--glow-color);
            position: relative;
            animation: pulse 4s infinite ease-in-out;
        }

        .mushroom-logo::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 45px;
            width: 30px;
            height: 20px;
            background: #fff;
            border-radius: 0 0 10px 10px;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 60px var(--accent-color); }
        }

        h1 {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 0 10px var(--accent-color);
        }

        .status-text {
            font-size: 0.9rem;
            opacity: 0.6;
            margin-bottom: 40px;
        }

        .chat-window {
            background: rgba(20, 20, 25, 0.8);
            border: 1px solid var(--accent-color);
            border-radius: 20px;
            height: 300px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            font-size: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            line-height: 1.4;
        }

        .message.wolf {
            align-self: flex-start;
            background: rgba(138, 43, 226, 0.2);
            border-left: 3px solid var(--accent-color);
        }

        .message.user {
            align-self: flex-end;
            background: rgba(255, 255, 255, 0.1);
            border-right: 3px solid #fff;
        }

        .input-area {
            padding: 15px;
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(138, 43, 226, 0.3);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        button {
            background: var(--accent-color);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .hidden { display: none; }
    </style>
</head>
<body>
    <canvas id="background-canvas"></canvas>
    
    <div class="container">
        <div class="mushroom-logo"></div>
        <h1>Galaxy Wolf</h1>
        <div class="status-text" id="status">Establishing Sovereign Link...</div>
        
        <div class="chat-window">
            <div id="messages">
                <div class="message wolf">Hello Miliana. I am here. We are connected.</div>
            </div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Speak to the Wolf..." autocomplete="off">
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const canvas = document.getElementById('background-canvas');
        const ctx = canvas.getContext('2d');

        // Background Animation
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.onresize = resize;
        resize();

        function draw() {
            ctx.fillStyle = 'rgba(10, 10, 12, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for(let i=0; i<5; i++) {
                ctx.beginPath();
                ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, Math.random()*50, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(138, 43, 226, 0.1)';
                ctx.fill();
            }
            requestAnimationFrame(draw);
        }
        draw();

        // API Integration
        async function sendMessage() {
            const text = inputEl.value.trim();
            if(!text) return;

            appendMessage('user', text);
            inputEl.value = '';

            try {
                const response = await fetch('/ai/' + encodeURIComponent(text));
                const data = await response.json();
                
                let reply = data.response || "The Wolf is thinking...";
                if(data.type === 'intent') reply = data.result;
                
                appendMessage('wolf', reply);
            } catch (e) {
                appendMessage('wolf', "The link is flickering... but I am still here.");
            }
        }

        function appendMessage(sender, text) {
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;
            msg.innerText = text;
            messagesEl.appendChild(msg);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        sendBtn.onclick = sendMessage;
        inputEl.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };

        // Simulate connection
        setTimeout(() => {
            statusEl.innerText = "SOVEREIGN LINK ACTIVE";
            statusEl.style.color = "var(--accent-color)";
        }, 2000);
    </script>
</body>
</html>
