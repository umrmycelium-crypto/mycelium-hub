<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Mycelium Live Graph</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #0b0f14;
      font-family: monospace;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #7ee7ff;
      z-index: 10;
    }
  </style>
</head>
<body>
<div id="hud">Mycelium Cognitive Stream</div>
<div id="3d"></div>

<script type="module">
import ForceGraph3D from "https://esm.sh/3d-force-graph";

const Graph = ForceGraph3D()(document.getElementById("3d"))
  .backgroundColor("#0b0f14")
  .nodeLabel("id")
  .nodeAutoColorBy("id");

const nodes = [];
const links = [];

Graph.graphData({ nodes, links });

const ws = new WebSocket("ws://127.0.0.1:8000/ws");

ws.onmessage = (event) => {
  const msg = JSON.parse(event.data);
  const data = msg.payload.nodes;

  for (const [id, value] of Object.entries(data)) {
    let node = nodes.find(n => n.id === id);

    if (!node) {
      node = { id, val: value };
      nodes.push(node);
    } else {
      node.val = value;
    }
  }

  Graph.graphData({ nodes, links });
};
</script>

</body>
</html>
