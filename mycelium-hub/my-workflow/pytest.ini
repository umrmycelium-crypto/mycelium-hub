[pytest]
# Test configuration for Mistral Workflows project

# Directories
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Enable async support
asyncio_mode = auto

# Default pytest options
addopts = -v --tb=short --cov=src --cov-report=term-missing --cov-report=html

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests
    unit: marks unit tests
    workflow: marks workflow-related tests
    activity: marks activity-related tests
    model: marks model validation tests
    connector: marks connector/MCP tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (30 seconds default)
timeout = 30

# Disable warnings summary
filterwarnings = ignore::DeprecationWarning

# Output formatting
console_output_style = count

# Random order (helps find test dependencies)
test_order_random = false

# Parallel execution (optional)
# addopts = -n auto  # Uncomment to enable parallel test execution
